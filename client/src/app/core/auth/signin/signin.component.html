<div class="flex flex-1 items-center justify-center p-4 my-8">
  <z-card class="w-full max-w-md p-6 sm:p-8 flex flex-col gap-4">
    <div class="flex flex-col items-center gap-2 mb-4">
      <h1 class="text-foreground text-[32px] font-bold tracking-tight text-center">Welcome Back</h1>
      <p class="text-muted-foreground text-base text-center">Sign in to your account to continue</p>
    </div>

    <app-auth mode="signIn" submitButtonText="Sign In" (submitForm)="handleSignIn($event)" class="mt-4" />

    <p class="text-muted-foreground text-sm text-center mt-6">
      Don't have an account?
	  <!-- router link heathennn -->
      <a class="font-semibold text-primary underline hover:text-primary/80" href="/register"> Sign Up </a>
    </p>
  </z-card>
</div>

<div class="relative flex flex-wrap items-center gap-2 rounded-lg border border-border bg-card p-2 min-h-[56px]">
  @for (tag of tags; track tag) {
  <z-badge variant="secondary" class="flex items-center gap-1.5">
    {{ tag }}
    <button type="button" (click)="removeTag(tag)">
      <z-icon name="close" class="text-sm" />
    </button>
  </z-badge>
  }

  <input
    class="flex-1 min-w-24 bg-transparent focus:outline-none p-1 placeholder:text-muted-foreground"
    [placeholder]="placeholder"
    [(ngModel)]="inputValue"
    (input)="onInputChange()"
    (keydown.enter)="handleEnter($event)"
    (keydown.arrowDown)="moveSelection(1)"
    (keydown.arrowUp)="moveSelection(-1)"
    [disabled]="tags.length >= maxTags"
  />

  @if (filteredSuggestions.length > 0 && inputValue.length > 0) {
  <div class="absolute left-0 top-full mt-1 w-full rounded-md border bg-popover shadow-sm z-10">
    @for (suggestion of filteredSuggestions; let i = $index; track suggestion) {
    <div
      class="px-3 py-2 cursor-pointer"
      [class.bg-accent]="i === highlightedIndex"
      (click)="selectSuggestion(suggestion)"
    >
      {{ suggestion }}
    </div>
    }
  </div>
  } @if (tags.length >= maxTags) {
  <div class="text-xs text-muted-foreground absolute bottom-0 right-0 m-1">Max tags reached ({{ maxTags }})</div>
  }
</div>

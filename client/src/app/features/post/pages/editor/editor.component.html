@if (isLoading) {
  <div class="flex items-center justify-center h-64">
    <p class="text-muted-foreground">Loading post...</p>
  </div>
} @else {
<form [formGroup]="postForm" (ngSubmit)="onPublish()">
  <main class="flex-1 px-4 sm:px-6 lg:px-10 py-8">
    <div class="layout-content-container flex flex-col max-w-7xl mx-auto">
      <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
        <h1 class="text-foreground text-4xl lg:text-5xl font-black font-display tracking-[-0.033em]">
          {{ isEditMode ? 'Edit Post' : 'Create New Post' }}
        </h1>
        <div class="flex items-center gap-3">
          <z-button zType="secondary" (click)="onSaveDraft()" type="button" [zLoading]="isSubmitting">
            <z-icon [zType]="draftIcon" class="text-lg" />
            <span>Save Draft</span>
          </z-button>
          <button z-button zType="default" type="submit" [zLoading]="isSubmitting">
            <z-icon [zType]="publishIcon" class="text-lg" />
            <span>{{ isSubmitting ? '' : (isEditMode ? 'Update' : 'Publish') }}</span>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 flex flex-col gap-6">
          <z-form-field>
            <label z-form-label zRequired for="title">Post Title</label>
            <z-form-control>
              <input z-input id="title" formControlName="title" placeholder="Enter your post title here..." class="h-14 text-lg" />
            </z-form-control>
          </z-form-field>

          <z-form-field>
            <label z-form-label zRequired for="desc">Short Description</label>
            <z-form-control>
              <input z-input id="desc" formControlName="desc" placeholder="Brief description for preview..." />
            </z-form-control>
          </z-form-field>

          <z-form-field>
            <label z-form-label zRequired for="category">Category</label>
            <z-form-control>
              <select
                id="category"
                formControlName="category"
                class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
              >
                @for (cat of categories; track cat) {
                  <option [value]="cat">{{ cat }}</option>
                }
              </select>
            </z-form-control>
          </z-form-field>

          <z-form-field>
            <label z-form-label>Content</label>
            <z-form-control>
              <app-rich-text-editor formControlName="content" placeholder="Start writing your content..." />
            </z-form-control>
          </z-form-field>
        </div>

        <div class="lg:col-span-1 flex flex-col gap-6">
          <z-form-field>
            <label z-form-label>Featured Image</label>
            <z-form-control>
              <app-image-uploader formControlName="featuredImage" />
            </z-form-control>
          </z-form-field>

          <z-form-field>
            <label z-form-label>Tags</label>
            <z-form-control>
              <app-tag-input
                formControlName="tags"
                [suggestions]="allTags"
                [maxTags]="5"
                placeholder="Add up to 5 tags..."
              ></app-tag-input>
            </z-form-control>
          </z-form-field>

          <z-form-field>
            <label z-form-label>Status</label>
            <z-form-control>
              <app-post-status-panel [form]="statusForm" />
            </z-form-control>
          </z-form-field>
        </div>
      </div>
    </div>
  </main>
</form>
}

@if (isLoading) {
  <div class="flex items-center justify-center h-64">
    <p class="text-muted-foreground">Loading article...</p>
  </div>
} @else if (post) {
<main class="bg-background px-4 sm:px-10 py-8 lg:py-12">
  <div class="flex flex-col gap-6 mb-8">
    <div class="flex flex-col gap-3">
      <p
        class="text-neutral-light dark:text-neutral-dark font-display text-4xl lg:text-5xl font-black leading-tight tracking-[-0.033em]"
      >
        {{ post.title }}
      </p>
    </div>
    <div class="flex items-center gap-4">
      <a [routerLink]="['/profile', post.author.username]" class="cursor-pointer">
        <z-avatar
          [zImage]="{
            url: $any(post.author.avatar),
            alt: post.author.username + ALT_TEXT,
            fallback: 'AA',
          }"
          class="w-12 h-12"
        />
      </a>
      <div>
        <a [routerLink]="['/profile', post.author.username]" class="cursor-pointer text-neutral-light dark:text-gray-200 text-base font-semibold leading-normal hover:text-primary-custom transition-colors">
          {{ post.author.username }}
        </a>
        <p class="text-muted-light dark:text-gray-400 text-sm font-normal leading-normal">
          Published on {{ post.createdAt }} • {{ readTime }}
        </p>
      </div>
    </div>
  </div>

  <div class="w-full grow aspect-[16/9] mb-8">
    <div
      class="w-full h-full bg-center bg-no-repeat bg-cover rounded-lg"
      [style.background-image]="'url(' + post.image + ')'"
    ></div>
  </div>

  <div
    class="prose prose-lg dark:prose-invert max-w-none font-display text-neutral-light dark:text-gray-300 text-lg leading-relaxed space-y-6"
    [innerHTML]="post.content"
  ></div>

  <app-social-share></app-social-share>

  <app-author-bio [author]="{ username: post.author.username, avatar: $any(post.author.avatar), bio: $any(post.author.bio) }"></app-author-bio>

  <app-comments-section></app-comments-section>
</main>
}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ng_blog_postgres
    # restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sharewithalviss_db}
      - POSTGRES_USER=${POSTGRES_USER:-blog_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog_user} -d ${POSTGRES_DB:-sharewithalviss_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ng_blog_api
    # restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-blog_user}      
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB:-sharewithalviss_db}
      
      NODE_ENV: development

    labels:
    - traefik.enable=true
    - traefik.http.routers.ngblog-api.rule=Host(`ngblogapi.piree.xyz`)
    - traefik.http.routers.ngblog-api.entryPoints=https
    - traefik.http.routers.ngblog-api.tls=true
    - traefik.http.routers.ngblog-api.tls.certresolver=letsencrypt
    - traefik.http.services.ngblog-api.loadbalancer.server.port=3000
    # ports:
    #   - "6789:3000"
    # command: pnpm start:dev

volumes:
  postgres_data:
